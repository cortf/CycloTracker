<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CycloTracker">
  <rect width="64" height="64" rx="14" fill="#0c1424"/>
  <!-- pin body -->
  <path d="M32 55C26 46 16 38 16 25A16 16 0 1 1 48 25C48 38 38 46 32 55Z" fill="#2f5a92"/>
  <!-- dark head disc -->
  <circle cx="32" cy="25" r="13.5" fill="#0c1424"/>
  <!-- lime ring -->
  <circle cx="32" cy="25" r="13" fill="none" stroke="#a3e635" stroke-width="2.4"/>
  <!-- dashed inner ring -->
  <circle cx="32" cy="25" r="9.8" fill="none" stroke="#3a6fb0" stroke-width="1.2" stroke-dasharray="2 2.2"/>
  <!-- oocyst cells: blue ring + lime nucleus -->
  <g stroke="#6fa8e0" stroke-width="1.3" fill="none">
    <circle cx="28" cy="21" r="2.8"/>
    <circle cx="37" cy="23" r="2.8"/>
    <circle cx="31" cy="30" r="2.8"/>
  </g>
  <g fill="#a3e635">
    <circle cx="28" cy="21" r="1.1"/>
    <circle cx="37" cy="23" r="1.1"/>
    <circle cx="31" cy="30" r="1.1"/>
  </g>
</svg>
